version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelease
      POSTGRES_USER: travelease
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelease"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: travelease
      DB_USER: travelease
      DB_PASSWORD: localpassword
      # Spring profile
      SPRING_PROFILES_ACTIVE: dev
      # AWS (set these if you want to test Bedrock locally with real credentials)
      AWS_REGION: ap-south-1
      BEDROCK_REGION: us-east-1
      BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
      # Set to 'true' and configure ~/.aws/credentials to test the AI feature locally
      RECOMMENDATION_ENABLED: "false"
      # JWT secret (local dev only)
      JWT_SECRET: local-dev-jwt-secret-change-this-in-production

volumes:
  postgres_data:
