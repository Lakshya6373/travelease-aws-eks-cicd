<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Explore All Destinations — TravelEase')}"></head>
<body class="page-destinations">

<nav th:replace="~{fragments/header :: nav}"></nav>

<!-- ── Page Banner ──────────────────────────────────────────────────────── -->
<div class="page-hero">
  <div class="container">
    <h1 class="page-title">Curated Destinations</h1>
    <p class="page-subtitle">Browse through <span th:text="${#lists.size(destinations)}">0</span> handpicked world-class locations with best-price guarantee</p>
  </div>
</div>

<main class="section">
  <div class="container">

    <!-- Category filter tabs -->
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="all">All Stays</button>
      <button class="filter-tab" data-filter="MOUNTAIN">Mountain Retreats</button>
      <button class="filter-tab" data-filter="BEACH">Beach & Coastal</button>
      <button class="filter-tab" data-filter="CITY">City Escapes</button>
      <button class="filter-tab" data-filter="ADVENTURE">Adventure & Nature</button>
      <button class="filter-tab" data-filter="CULTURAL">Historic & Cultural</button>
      <button class="filter-tab" data-filter="WILDLIFE">Wildlife Safari</button>
      <button class="filter-tab" data-filter="HONEYMOON">Romantic Honeymoon</button>
    </div>

    <!-- Destinations grid -->
    <div class="destinations-grid" id="destinations-grid">
      <div th:each="dest : ${destinations}"
           class="destination-card"
           th:data-category="${dest.category}"
           th:data-id="${dest.id}">
        <div class="card-image-wrapper">
          <img th:src="${dest.imageUrl}"
               th:alt="${dest.name}"
               class="card-image"
               loading="lazy"
               onerror="this.src='https://images.unsplash.com/photo-1488085061387-422e29b40080?w=800'" />
          <div class="card-category-badge" th:text="${dest.category}"></div>
          <div class="card-wishlist-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e8392a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
          </div>
        </div>

        <div class="card-body">
          <div class="card-location">
            <svg class="card-location-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
            </svg>
            <span th:text="${dest.name + ', ' + dest.country}"></span>
          </div>
          <p class="card-description" th:text="${#strings.abbreviate(dest.description, 105)}"></p>
          <div class="card-footer">
            <div class="card-price">
              <span class="price-from">From</span>
              <span class="price-amount" th:text="'$' + ${dest.pricePerNight}"></span>
              <span class="price-unit">/ night</span>
            </div>
            <a th:href="@{/destinations/{id}(id=${dest.id})}" class="btn btn-primary btn-sm">View Deal</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="no-results" class="empty-state" style="display:none;">
      <div class="empty-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <h3>No destinations found</h3>
      <p>Try switching to another category or browse all stays.</p>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
  // Client-side category filtering
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const filter = tab.dataset.filter;
      const cards = document.querySelectorAll('.destination-card');
      let visible = 0;
      cards.forEach(card => {
        const match = filter === 'all' || card.dataset.category === filter;
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
    });
  });
</script>
</body>
</html>
