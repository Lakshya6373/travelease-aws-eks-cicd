<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  This fragment is returned by POST /recommend via Thymeleaf fragment rendering.
  It is injected into #recommendation-results on the home page via HTMX.
-->
<div th:fragment="results" class="container">

  <!-- Query echo + count -->
  <div class="results-header" th:if="${results != null}">
    <div class="results-meta">
      <span class="ai-badge">🤖 AI Powered</span>
      <h2 class="results-title">
        Results for "<span th:text="${query}">your query</span>"
      </h2>
      <p class="results-count"
         th:text="${#lists.size(results)} + ' destination(s) matched'"></p>
    </div>
  </div>

  <!-- AI blurb (shown once, from the first result with a blurb) -->
  <div class="ai-blurb-banner"
       th:if="${results != null and not #lists.isEmpty(results) and results[0].hasBlurb()}">
    <span class="blurb-icon">💡</span>
    <span th:text="${results[0].aiBlurb}"></span>
  </div>

  <!-- Destination cards grid -->
  <div class="destinations-grid" th:if="${results != null and not #lists.isEmpty(results)}">
    <div th:each="result : ${results}" class="destination-card result-card">
      <div class="card-image-wrapper">
        <img th:src="${result.destination.imageUrl}"
             th:alt="${result.destination.name}"
             class="card-image"
             loading="lazy"
             onerror="this.src='https://images.unsplash.com/photo-1488085061387-422e29b40080?w=800'" />
        <div class="card-category-badge" th:text="${result.destination.category}"></div>
      </div>
      <div class="card-body">
        <div class="card-location">
          <span class="location-icon">📍</span>
          <span th:text="${result.destination.name + ', ' + result.destination.country}"></span>
        </div>
        <p class="card-description"
           th:text="${#strings.abbreviate(result.destination.description, 110)}"></p>
        <div class="card-footer">
          <div class="card-price">
            <span class="price-amount" th:text="'$' + ${result.destination.pricePerNight}"></span>
            <span class="price-unit">/ night</span>
          </div>
          <a th:href="@{/destinations/{id}(id=${result.destination.id})}"
             class="btn btn-primary btn-sm">View →</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty / fallback state -->
  <div th:if="${results == null or #lists.isEmpty(results)}" class="empty-state">
    <div class="empty-icon">🔭</div>
    <p>No destinations matched. Try a different search term.</p>
  </div>

</div>
</body>
</html>
