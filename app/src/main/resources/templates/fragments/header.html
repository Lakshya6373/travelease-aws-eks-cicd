<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TravelEase — AI-powered travel destination discovery and booking platform." />
  <title th:text="${pageTitle}">TravelEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
</head>

<nav th:fragment="nav" class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-brand">
      <span class="nav-logo">✈️</span>
      <span class="nav-brand-name">TravelEase</span>
    </a>

    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/destinations" class="nav-link">Destinations</a>

      <!-- Authenticated links -->
      <div sec:authorize="isAuthenticated()" class="nav-auth-group">
        <a href="/my-bookings" class="nav-link">My Bookings</a>
        <form th:action="@{/logout}" method="post" class="nav-logout-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn-outline-primary btn-sm">Sign Out</button>
        </form>
      </div>

      <!-- Unauthenticated links -->
      <div sec:authorize="!isAuthenticated()" class="nav-auth-group">
        <a href="/login" class="nav-link">Sign In</a>
        <a href="/register" class="btn btn-primary btn-sm">Get Started</a>
      </div>
    </div>
  </div>
</nav>
</html>
