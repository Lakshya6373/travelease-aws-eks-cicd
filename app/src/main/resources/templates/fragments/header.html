<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TravelEase — Next-Gen AI Travel Discovery & Instant Booking Platform." />
  <title th:text="${pageTitle}">TravelEase — Smarter Way to Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 22 C6 14 14 9 26 7 L14 18 L4 22 Z' fill='%230066ff'/><path d='M28 5 L10 19 L17 21 L28 5 Z' fill='%23ff385c'/><circle cx='28' cy='5' r='2.5' fill='%23ffd166'/></svg>" />
</head>

<nav th:fragment="nav" class="navbar">
  <div class="nav-container">
    <a href="/" class="nav-brand">
      <svg class="brand-mark-svg" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="teGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF385C"/>
            <stop offset="100%" stop-color="#FF6B35"/>
          </linearGradient>
          <linearGradient id="teGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#06B6D4"/>
          </linearGradient>
        </defs>
        <circle cx="19" cy="19" r="18" fill="url(#teGradPrimary)" fill-opacity="0.08" stroke="#E2E8F0" stroke-width="0.8"/>
        <path d="M7 23.5 C9 15.5 17 9.5 28 8 L16 19.5 L7 23.5 Z" fill="url(#teGradBlue)"/>
        <path d="M32 6.5 L12 21.5 L19.5 23 L32 6.5 Z" fill="url(#teGradPrimary)"/>
        <path d="M32 6.5 L19.5 23 L22 30.5 L26 23.5 L32 6.5 Z" fill="#DC2626"/>
        <circle cx="32" cy="6.5" r="2.2" fill="#FFD166"/>
      </svg>
      <div class="nav-brand-text">
        Travel<span class="brand-accent">Ease</span>
        <span class="nav-brand-badge">AI</span>
      </div>
    </a>

    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/destinations" class="nav-link">Destinations</a>

      <!-- Authenticated links -->
      <div sec:authorize="isAuthenticated()" class="nav-auth-group">
        <a href="/my-bookings" class="nav-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          My Bookings
        </a>
        <form th:action="@{/logout}" method="post" class="nav-logout-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" class="btn btn-outline btn-sm">Sign Out</button>
        </form>
      </div>

      <!-- Unauthenticated links -->
      <div sec:authorize="!isAuthenticated()" class="nav-auth-group">
        <a href="/login" class="nav-link">Sign In</a>
        <a href="/register" class="btn btn-primary btn-sm">Create Account</a>
      </div>
    </div>
  </div>
</nav>
</html>
