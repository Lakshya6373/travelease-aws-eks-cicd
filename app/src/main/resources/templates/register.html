<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Create Account — TravelEase')}"></head>
<body class="page-auth">

<nav th:replace="~{fragments/header :: nav}"></nav>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-logo">🌍</div>
    <h1 class="auth-title">Start Exploring</h1>
    <p class="auth-subtitle">Create your free TravelEase account</p>

    <!-- Registration error -->
    <div th:if="${registerError}" class="alert alert-error" th:text="${registerError}"></div>

    <form id="register-form" th:action="@{/register}" method="post" class="auth-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-input"
               placeholder="Jane Doe" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-input"
               placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input"
               placeholder="Min. 8 characters" required minlength="8"
               autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="register-btn">Create Account</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
