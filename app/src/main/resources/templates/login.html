<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign In — TravelEase')}"></head>
<body class="page-auth">

<nav th:replace="~{fragments/header :: nav}"></nav>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-logo">✈️</div>
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to manage your travel bookings</p>

    <!-- Success message after registration -->
    <div th:if="${param.registered}" class="alert alert-success">
      Registration successful! Please sign in.
    </div>

    <!-- Login error -->
    <div th:if="${loginError}" class="alert alert-error" th:text="${loginError}"></div>

    <form id="login-form" th:action="@{/login}" method="post" class="auth-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="username" class="form-label">Email Address</label>
        <input type="email" id="username" name="username" class="form-input"
               placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input"
               placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="/register">Create one</a>
    </p>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
