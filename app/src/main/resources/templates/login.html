<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Sign In — TravelEase')}"></head>
<body>

<nav th:replace="~{fragments/header :: nav}"></nav>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg class="brand-mark-svg" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 40px; height: 40px;">
        <circle cx="19" cy="19" r="18" fill="rgba(232,57,42,0.08)" stroke="#E2E8F0" stroke-width="0.8"/>
        <path d="M7 23.5 C9 15.5 17 9.5 28 8 L16 19.5 L7 23.5 Z" fill="#0066ff"/>
        <path d="M32 6.5 L12 21.5 L19.5 23 L32 6.5 Z" fill="#ff385c"/>
        <path d="M32 6.5 L19.5 23 L22 30.5 L26 23.5 L32 6.5 Z" fill="#dc2626"/>
        <circle cx="32" cy="6.5" r="2.2" fill="#ffd166"/>
      </svg>
      <div class="nav-brand-text">
        Travel<span class="brand-accent">Ease</span>
        <span class="nav-brand-badge">AI</span>
      </div>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to manage your bookings and unlocked travel perks</p>

    <!-- Success message after registration -->
    <div th:if="${param.registered}" class="alert alert-success">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Registration successful! Please sign in.</span>
    </div>

    <!-- Login error -->
    <div th:if="${loginError}" class="alert alert-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span th:text="${loginError}"></span>
    </div>

    <form id="login-form" th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

      <div class="form-group">
        <label for="username" class="form-label">Email Address</label>
        <input type="email" id="username" name="username" class="form-control"
               placeholder="name@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="login-btn" style="width: 100%; padding: 12px; margin-top: 8px;">
        Sign In to Your Account
      </button>
    </form>

    <div class="auth-divider">
      <span>NEW TO TRAVELEASE?</span>
    </div>

    <p class="auth-footer-text">
      Don't have an account? <a href="/register">Create an account</a>
    </p>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
