server:
  port: 8080

spring:
  datasource:
    # In-cluster: DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD are populated by
    # SecretsConfig.java which fetches travelease/{env}/app-secrets from AWS SM at startup.
    # Locally: use defaults below (docker-compose sets real values via environment block).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travelease}
    username: ${DB_USER:travelease}
    password: ${DB_PASSWORD:localpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # exposes /actuator/health/liveness and /actuator/health/readiness
  metrics:
    tags:
      application: travelease

# Application-level config + JWT
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me}
  recommendation:
    enabled: ${RECOMMENDATION_ENABLED:true}

# AWS config — all in ap-south-1 (Mumbai)
aws:
  region: ${AWS_REGION:ap-south-1}
  bedrock:
    # APAC regional inference profile: apac. prefix routes within Asia Pacific (Mumbai, Tokyo, Sydney, Seoul, etc.)
    region: ${BEDROCK_REGION:ap-south-1}
    model-id: ${BEDROCK_MODEL_ID:apac.amazon.nova-micro-v1:0}
  secrets:
    # Secrets Manager secret name — injected by Helm via SECRET_NAME env var
    secret-name: ${SECRET_NAME:}
