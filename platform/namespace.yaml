apiVersion: v1
kind: Namespace
metadata:
  name: travelease
  labels:
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: travelease-quota
  namespace: travelease
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "4Gi"
    limits.cpu: "8"
    limits.memory: "8Gi"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: travelease-limitrange
  namespace: travelease
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      max:
        cpu: "2"
        memory: "2Gi"
