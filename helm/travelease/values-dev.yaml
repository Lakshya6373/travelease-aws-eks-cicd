# Dev overrides — WAF disabled, 1 replica
replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: "dev"
  RECOMMENDATION_ENABLED: "true"

serviceAccount:
  bedrockRoleArn: ""  # Replace with: terraform output -raw bedrock_role_arn (from dev env)

ingress:
  wafAclArn: ""  # WAF disabled in dev
  accessLogsBucket: ""  # Replace with: terraform output -raw access_logs_bucket (from dev env)

autoscaling:
  minReplicas: 1
  maxReplicas: 2
