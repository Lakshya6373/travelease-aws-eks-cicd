# Dev overrides — WAF disabled, 1 replica
replicaCount: 1

image:
  repository: "892978057052.dkr.ecr.ap-south-1.amazonaws.com/travelease"
  tag: "v1.0"
  pullPolicy: IfNotPresent

env:
  SPRING_PROFILES_ACTIVE: "dev"
  RECOMMENDATION_ENABLED: "true"
  # Env-scoped secret — Terraform outputs this value after apply
  # Format: travelease/{env}/app-secrets
  SECRET_NAME: "travelease/dev/app-secrets"

serviceAccount:
  # Combined IRSA role: Bedrock (ap-south-1) + SecretsManager read
  # Get the exact ARN from: terraform output app_role_arn
  bedrockRoleArn: "arn:aws:iam::892978057052:role/dev-app-irsa"

ingress:
  wafAclArn: ""  # WAF disabled in dev
  accessLogsBucket: "travelease-dev-alb-logs-892978057052"

autoscaling:
  minReplicas: 1
  maxReplicas: 2

# Prometheus Operator is installed by bootstrap-cluster.sh — safe to enable
serviceMonitor:
  enabled: true
