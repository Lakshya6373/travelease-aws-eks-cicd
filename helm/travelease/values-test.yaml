# Test (staging) overrides — WAF enabled
replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: "test"
  RECOMMENDATION_ENABLED: "true"
  SECRET_NAME: "travelease/test/app-secrets"

serviceAccount:
  roleArn: ""         # Replace with: terraform output -raw app_role_arn (from test env)
  bedrockRoleArn: ""

ingress:
  wafAclArn: ""      # Replace with: terraform output -raw waf_acl_arn (from test env)
  accessLogsBucket: "" # Replace with: terraform output -raw access_logs_bucket (from test env)

autoscaling:
  minReplicas: 1
  maxReplicas: 3

# Prometheus Operator is installed by bootstrap-cluster.sh — safe to enable
serviceMonitor:
  enabled: true
