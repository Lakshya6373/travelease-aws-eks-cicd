replicaCount: 1

image:
  # Override at deploy time: --set image.repository=<account>.dkr.ecr.ap-south-1.amazonaws.com/travelease
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: "travelease-app"
  # Combined IRSA role ARN (Bedrock ap-south-1 + Secrets Manager) — set per env
  roleArn: ""
  bedrockRoleArn: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "alb"
  wafAclArn: ""         # Set to WAF Web ACL ARN in test/prod
  accessLogsBucket: ""  # Set to access logs S3 bucket name per env

env:
  AWS_REGION: "ap-south-1"
  BEDROCK_REGION: "ap-south-1"
  # APAC regional inference profile prefix: "apac." routes requests within Asia Pacific
  BEDROCK_MODEL_ID: "apac.amazon.nova-micro-v1:0"
  RECOMMENDATION_ENABLED: "true"
  SPRING_PROFILES_ACTIVE: "prod"
  # AWS Secrets Manager secret name — set per environment in values-{env}.yaml
  # App fetches this secret at startup via IRSA (no ESO operator needed)
  SECRET_NAME: ""

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

# PodDisruptionBudget
pdb:
  minAvailable: 1

livenessProbe:
  path: /actuator/health/liveness
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  path: /actuator/health/readiness
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

# Namespace governance — ResourceQuota and LimitRange
quota:
  enabled: true
  requests:
    cpu: "4"
    memory: "4Gi"
  limits:
    cpu: "8"
    memory: "8Gi"
  pods: "20"

limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "512Mi"
  defaultRequest:
    cpu: "100m"
    memory: "256Mi"
  max:
    cpu: "2"
    memory: "2Gi"

# Prometheus ServiceMonitor — only enable after kube-prometheus-stack is installed
serviceMonitor:
  enabled: false
