apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "travelease.serviceAccountName" . }}
  namespace: travelease
  labels:
    {{- include "travelease.labels" . | nindent 4 }}
  annotations:
    # IRSA: grants this pod identity access to Bedrock via the role specified in values
    {{- if .Values.serviceAccount.bedrockRoleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.bedrockRoleArn | quote }}
    {{- end }}
