apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "travelease.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelease.labels" . | nindent 4 }}
  annotations:
    # IRSA: grants this pod identity access to Bedrock and Secrets Manager via IRSA
    {{- $roleArn := or .Values.serviceAccount.roleArn .Values.serviceAccount.bedrockRoleArn }}
    {{- if $roleArn }}
    eks.amazonaws.com/role-arn: {{ $roleArn | quote }}
    {{- end }}
