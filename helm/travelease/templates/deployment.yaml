apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "travelease.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "travelease.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "travelease.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "travelease.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod restart when ConfigMap changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "travelease.serviceAccountName" . }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true

          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "travelease.fullname" . }}-config

          # The app fetches DB credentials directly from AWS Secrets Manager at
          # startup using the SDK + IRSA. SECRET_NAME tells it which secret to read.
          # No ESO / ExternalSecret / ClusterSecretStore needed.
          env:
            - name: SECRET_NAME
              value: {{ .Values.env.SECRET_NAME | quote }}

          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: 8080
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      terminationGracePeriodSeconds: 30
