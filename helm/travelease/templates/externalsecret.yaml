apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "travelease.fullname" . }}-db-secret
  namespace: travelease
  labels:
    {{- include "travelease.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: travelease-db-secret
    creationPolicy: Owner

  data:
    - secretKey: db_host
      remoteRef:
        key: "travelease/{{ .Values.env.SPRING_PROFILES_ACTIVE }}/app-secrets"
        property: db_host
    - secretKey: db_port
      remoteRef:
        key: "travelease/{{ .Values.env.SPRING_PROFILES_ACTIVE }}/app-secrets"
        property: db_port
    - secretKey: db_name
      remoteRef:
        key: "travelease/{{ .Values.env.SPRING_PROFILES_ACTIVE }}/app-secrets"
        property: db_name
    - secretKey: db_user
      remoteRef:
        key: "travelease/{{ .Values.env.SPRING_PROFILES_ACTIVE }}/app-secrets"
        property: db_user
    - secretKey: db_password
      remoteRef:
        key: "travelease/{{ .Values.env.SPRING_PROFILES_ACTIVE }}/app-secrets"
        property: db_password
    - secretKey: jwt_secret
      remoteRef:
        key: "travelease/{{ .Values.env.SPRING_PROFILES_ACTIVE }}/app-secrets"
        property: jwt_secret
